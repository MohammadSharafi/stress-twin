[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stress-twin"
version = "0.1.0"
description = "Adversarial simulation testing for robot manipulation policies, powered by NVIDIA Nemotron on Nebius Token Factory."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
  "mujoco>=3.2",
  "numpy>=1.26",
  "torch>=2.2",
  "scikit-learn>=1.4",
  "pillow>=10",
  "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fastapi>=0.110", "uvicorn>=0.29"]
video = ["soundfile>=0.12", "scipy>=1.11"]

[project.scripts]
stress-twin = "stress_twin.cli:main"

[tool.setuptools]
packages = ["stress_twin"]

[tool.setuptools.package-data]
stress_twin = ["assets/*.pt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
